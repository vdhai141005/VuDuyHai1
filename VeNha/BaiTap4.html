<!DOCTYPE html>
<html>
    <head>
        <title>Đồng hồ đếm ngược bằng JS</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <style>
            span{border: solid 1px #ACACAC; padding: 2px;}
            /* Thêm chút margin cho dễ nhìn */
            div { margin-bottom: 15px; }
        </style>
        <script language="javascript">

            var h = null; // Giờ
            var m = null; // Phút
            var s = null; // Giây
            
            var timeout = null; // Biến lưu trữ sự kiện setTimeout
            
            function start()
            {
                /* BƯỚC 1: LẤY DỮ LIỆU ĐẦU VÀO
                   Chỉ lấy dữ liệu từ ô input khi biến h chưa có giá trị (lần đầu bấm Start)
                */
                if (h === null) {
                    h = parseInt(document.getElementById('h_val').value);
                    m = parseInt(document.getElementById('m_val').value);
                    s = parseInt(document.getElementById('s_val').value);
                }

                // Xử lý trường hợp người dùng không nhập gì (NaN) thì coi như là 0
                if (isNaN(h)) h = 0;
                if (isNaN(m)) m = 0;
                if (isNaN(s)) s = 0;

                /* BƯỚC 2: HIỂN THỊ RA MÀN HÌNH (Cập nhật giao diện trước)
                */
                // Gán giá trị vào thẻ span
                document.getElementById('h').innerText = h;
                document.getElementById('m').innerText = m;
                document.getElementById('s').innerText = s;

                /* BƯỚC 3: KIỂM TRA DỪNG
                   Nếu tất cả bằng 0 thì dừng lại và thông báo
                */
                if (h === 0 && m === 0 && s === 0) {
                    clearTimeout(timeout);
                    // alert("Hết giờ!"); // Có thể bật lên nếu muốn thông báo
                    return;
                }

                /* BƯỚC 4: TÍNH TOÁN GIẢM THỜI GIAN
                */
                s--; // Giảm giây đi 1

                // Nếu giây âm -> Giảm phút, gán giây = 59
                if (s < 0) {
                    m--;
                    s = 59;
                }

                // Nếu phút âm -> Giảm giờ, gán phút = 59
                if (m < 0) {
                    h--;
                    m = 59;
                }

                /* BƯỚC 5: GỌI LẠI HÀM SAU 1 GIÂY (1000ms)
                */
                timeout = setTimeout(function(){
                    start();
                }, 1000);
            }
            
            function stop(){
                // Xóa timeout để dừng đồng hồ
                clearTimeout(timeout);
            }
        </script>
    </head>
    <body>
        <div>
            <strong>
                Nhập thông tin ban đầu: <br/>
            </strong>
            <input type="text" id="h_val" placeholder="Giờ" value="0"/> <br/>
            <input type="text" id="m_val" placeholder="Phút" value="0"/> <br/>
            <input type="text" id="s_val" placeholder="Giây" value="10"/>
            
            <input type="button" value="Start" onclick="start()"/>
            <input type="button" value="Stop" onclick="stop()"/>  <br/> <br/>
        </div>
        
        <div style="font-size: 20px; font-weight: bold;">
            <span id="h">Giờ</span> :
            <span id="m">Phút</span> :
            <span id="s">Giây</span>
        </div>
    </body>
</html>
